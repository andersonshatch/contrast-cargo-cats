name: Build, Deploy and Test Cargo Cats

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - dataservice
          - webhookservice
          - frontgateservice
          - console-ui
          - exploit-server
          - imageservice
          - labelservice
          - docservice
          - contrastdatacollector
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push ${{ matrix.service }}
      uses: docker/build-push-action@v5
      with:
        context: ./services/${{ matrix.service }}
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare storage directories
      run: |
        sudo mkdir -p /tmp/k3d-storage /var/lib/rancher/k3s/storage
        sudo chmod 777 /tmp/k3d-storage /var/lib/rancher/k3s/storage
        echo "Available disk space:"
        df -h /tmp /var/lib

    - name: Setup K3D cluster
      uses: nolar/setup-k3d-k3s@v1
      with:
        version: v1.28
        k3d-name: cargo-cats-cluster
        k3d-args: "--port 80:80@loadbalancer --port 443:443@loadbalancer --volume /tmp/k3d-storage:/tmp --volume /var/lib/rancher/k3s/storage:/var/lib/rancher/k3s/storage"

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'

    - name: Download Helm dependencies
      run: |
        cd contrast-cargo-cats && helm dependency update

    - name: Update Helm charts to use GHCR images
      run: |
        # Update contrast-cargo-cats values.yaml to use the built images from GHCR
        sed -i "s|image: dataservice:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dataservice:${{ github.sha }}|g" contrast-cargo-cats/values.yaml
        sed -i "s|image: webhookservice:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/webhookservice:${{ github.sha }}|g" contrast-cargo-cats/values.yaml
        sed -i "s|image: frontgateservice:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontgateservice:${{ github.sha }}|g" contrast-cargo-cats/values.yaml
        sed -i "s|image: imageservice:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/imageservice:${{ github.sha }}|g" contrast-cargo-cats/values.yaml
        sed -i "s|image: labelservice:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/labelservice:${{ github.sha }}|g" contrast-cargo-cats/values.yaml
        sed -i "s|image: docservice:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/docservice:${{ github.sha }}|g" contrast-cargo-cats/values.yaml

        # Update simulation console values
        sed -i "s|image: console-ui:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/console-ui:${{ github.sha }}|g" simulation-console/values.yaml
        sed -i "s|image: contrastdatacollector:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/contrastdatacollector:${{ github.sha }}|g" simulation-console/values.yaml
        sed -i "s|image: exploit-server:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/exploit-server:${{ github.sha }}|g" simulation-console/values.yaml

    - name: Create Contrast Agent secret
      run: |
        echo "Creating Contrast Agent connection secret..."
        kubectl create namespace contrast-agent-operator --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret generic contrast-agent-token \
          --namespace contrast-agent-operator \
          --from-literal=token=${{ secrets.CONTRAST_AGENT_TOKEN }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy Contrast Agent Operator
      run: |
        echo "Deploying Contrast Agent Operator..."
        helm repo add contrast https://contrastsecurity.dev/helm-charts
        helm repo update contrast

        echo "Using Helm chart for Contrast Agent Operator..."
        helm upgrade --install contrast-agent-operator contrast/contrast-agent-operator \
          --namespace contrast-agent-operator \
          --set clusterDefaults.enabled=true \
          --set clusterDefaults.existingTokenSecret=contrast-agent-token \
          --set operator.enableAgentStdout=true \
          --wait --timeout=300s

    - name: Deploy cargo-cats application
      run: |
        helm upgrade --install contrast-cargo-cats ./contrast-cargo-cats \
          --cleanup-on-fail \
          --set contrast.uniqName=ja \
          --set buildNumber=${{ github.run_number }}
        #--wait --timeout=10m

    - name: Wait for ingress controller
      run: |
        echo "Waiting for ingress controller to be ready..."
        kubectl wait --for=condition=available --timeout=300s deployment/contrast-cargo-cats-ingress-nginx-controller

    - name: Deploy simulation console
      run: |
        export INGRESS_IP=$(kubectl get service contrast-cargo-cats-ingress-nginx-controller -o jsonpath='{.spec.clusterIP}')
        echo "Ingress controller IP: $INGRESS_IP"

        helm upgrade --install simulation-console ./simulation-console \
          --cleanup-on-fail \
          --set-string aliashost.cargocats\\.localhost=$INGRESS_IP \
          --set contrastdatacollector.contrastUniqName=${CONTRAST__UNIQ__NAME} \
          --set contrastdatacollector.contrastApiToken=${CONTRAST__AGENT__TOKEN} \
          --set contrastdatacollector.contrastApiKey=${CONTRAST__API__KEY} \
          --set contrastdatacollector.contrastApiAuthorization=${CONTRAST__API__AUTHORIZATION} \
          --set consoleui.contrastApiToken=${CONTRAST__AGENT__TOKEN} \
          --set consoleui.contrastUniqName=${CONTRAST__UNIQ__NAME} \
          --set consoleui.contrastApiKey=${CONTRAST__API__KEY} \
          --set consoleui.contrastApiAuthorization=${CONTRAST__API__AUTHORIZATION}
          #--wait --timeout=10m

    - name: Wait for resources to be ready
      run: |
        echo "Waiting for simulation console deployment to be ready..."
        kubectl wait --for=condition=available --timeout=300s deployment/simulation-console-console-ui
        kubectl wait --for=condition=ready --timeout=300s pod -l app=console-ui
        kubectl wait --for=condition=available --timeout=300s deployment/simulation-console-zapproxy
        echo "Waiting for cargo-cats deployments to be ready..."
        kubectl wait --for=condition=available --timeout=300s deployment/contrast-cargo-cats-frontgateservice
        kubectl wait --for=condition=available --timeout=300s deployment/contrast-cargo-cats-dataservice
        kubectl wait --for=condition=available --timeout=300s deployment/contrast-cargo-cats-webhookservice
        kubectl wait --for=condition=available --timeout=300s deployment/contrast-cargo-cats-labelservice
        kubectl wait --for=condition=available --timeout=300s deployment/contrast-cargo-cats-docservice
        kubectl wait --for=condition=available --timeout=300s deployment/contrast-cargo-cats-imageservice

    - name: Setup port forwarding for testing
      run: |
        # Port forward the console service for testing
        kubectl port-forward service/console-ui 8080:5000 &

        # Wait a moment for port forwarding to establish
        sleep 10

        # Test that the console is accessible
        curl -f http://localhost:8080/zap/scan/status || echo "Console health check failed, continuing anyway"

    - name: Run traffic simulation
      run: |
        echo "Running traffic simulation..."
        curl "http://localhost:8080/traffic/start"

    - name: Run ineffective attacks simulation
      run: |
        echo "Waiting for ZAP to be healthy..."
        until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/zap/health)" = "200" ]; do sleep 1; done;
        echo "Running ineffective attacks..."
        curl "http://localhost:8080/zap/scan/start"

    - name: Run effective attacks simulation
      run: |
        echo "Running effective attacks..."
        curl "http://localhost:8080/exploit/start"

    - name: Wait between attack phases
      run: |
        echo "Waiting for activity..."
        sleep 90
        curl "http://localhost:8080/exploit/status"

    - name: Collect logs and status
      if: always()
      run: |
        echo "=== DEPLOYMENT STATUS ==="
        kubectl get all -o wide

        echo "=== POD LOGS ==="
        mkdir -p pod-logs
        
        # Collect logs from all pods
        for pod in $(kubectl get pods -o name); do
          pod_name=$(echo $pod | cut -d'/' -f2)
          echo "Collecting logs for $pod_name..."
          kubectl logs $pod --all-containers=true > pod-logs/${pod_name}.log 2>&1 || echo "Failed to get logs for $pod_name"
        done
        
        # Also collect previous logs if pods have restarted
        for pod in $(kubectl get pods -o name); do
          pod_name=$(echo $pod | cut -d'/' -f2)
          echo "Collecting previous logs for $pod_name..."
          kubectl logs $pod --previous --all-containers=true > pod-logs/${pod_name}-previous.log 2>&1 || echo "No previous logs for $pod_name"
        done

        echo "=== EVENTS ==="
        kubectl get events --sort-by=.metadata.creationTimestamp > pod-logs/events.log

        echo "=== POD DESCRIPTIONS ==="
        kubectl describe pods > pod-logs/pod-descriptions.log

    - name: Upload pod logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pod-logs-${{ github.run_number }}
        path: pod-logs/
        retention-days: 14

    - name: Cleanup
      if: always()
      run: |
        # Kill port forwarding
        pkill -f "kubectl port-forward" || true

        # Optional: Clean up cluster (k3d will be cleaned up automatically by the action)
        helm uninstall cargo-cats || true
        helm uninstall simulation-console || true
  fetch-results:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ja-contrast-cargo-cats-dataservice
          - ja-contrast-cargo-cats-docservice
          - ja-contrast-cargo-cats-frontgateservice
          - ja-contrast-cargo-cats-imageservice
          - ja-contrast-cargo-cats-labelservice
          - ja-contrast-cargo-cats-webhookservice
    needs: deploy
    steps:
      - name: Assess verify
        uses: Contrast-Security-OSS/integration-verify-github-action@summary
        with:
          apiKey: ${{ secrets.CONTRAST_API_KEY }}
          orgId: ${{ vars.CONTRAST_ORG_ID }}
          authHeader: ${{ secrets.CONTRAST_AUTHORIZATION_KEY }}
          appName: ${{ matrix.service }}
          apiUrl: https://${{ vars.CONTRAST_HOST }}
          buildNumber: ${{ github.run_number }}